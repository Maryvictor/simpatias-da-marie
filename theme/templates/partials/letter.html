<div class="mail" aria-live="off">
  <div class="paper" data-paper data-show="papel envelope" hidden aria-label="Pré-visualização da carta"></div>
  <div class="envelope" aria-hidden="true">
    <div class="env-back"></div>
    <div class="env-letter"></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="stamp">
      <svg viewBox="0 0 48 56" width="48" height="56"><rect x="1" y="1" width="46" height="54" rx="3" fill="#fff8ee" stroke="#d9a431" stroke-width="2" stroke-dasharray="3 2"/><circle cx="24" cy="22" r="9" fill="#f4a9bd"/><path d="M24 31 C 22 40 24 44 24 48" stroke="#6f9a62" stroke-width="3" fill="none"/></svg>
    </div>
  </div>
  <div class="step-actions">
    <button type="button" class="btn" data-to-envelope data-show="papel" hidden>Colocar no envelope</button>
    <button type="button" class="btn" data-to-stamp hidden>Aplicar o selo</button>
  </div>
</div>
